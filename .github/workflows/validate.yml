name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 硬门：结构 + 语法 + 每个导出函数能否被调用
      - name: Structure gate
        run: node scripts/check-structure.mjs

      # 硬门：全部回归测试（81 条，含四态判定、TUI 视觉、键位路由）
      - name: Tests
        run: node --test scripts/*.test.mjs

      # 硬门：文档里的相对链接必须能解析。
      # 曾是 continue-on-error 的建议门，理由是「存量未清零」；存量其实一直是 0，
      # 那条注释只是让检查永远不红。现已升级为硬门，并加 --include 限制范围。
      - name: Dead links
        run: |
          fail=0
          while read -r p; do
            if [ ! -e "$p" ]; then
              echo "::error file=README.md::死链: $p"
              fail=1
            fi
          done < <(
            grep -rhoE '\]\(([^)#]+\.md)(#[^)]*)?\)' README.md CLAUDE.md docs/*.md 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//; s/#.*//' | sort -u
          )
          exit $fail
