name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 硬门：结构 + 语法 + 每个导出函数能否被调用 + 文档一致性
      # （测试数对账 / 文档引用的路径与命令 / 文档常量 / 研究索引 / 能力清单）
      - name: Structure gate
        run: node scripts/check-structure.mjs

      # 硬门：全部回归测试（1276 条，含状态判定、TUI 视觉、键位路由）。
      # 数字由 check-structure.mjs 对账，与 README / CLAUDE / GUIDE 同源。
      #
      # `scripts/` 目录形式而不是 `scripts/*.test.mjs`：Node 22 之前**不展开 glob**，
      # 在 cmd.exe / PowerShell 上通配符会原样传给 Node 并报「文件找不到」。
      # CI 的 runner 是 bash，但文档里的同一条命令也会被别人在 Windows 默认终端里敲。
      - name: Tests
        run: node --test scripts/

      # 死链检查不再单独实现：`check-structure.mjs` 的 `checkLinks()` 已经按
      # **文件所在目录**解析相对链接（早先这里用仓库根当基准，对 `docs/*.md`
      # 误报 9 条）。上面那道 Structure gate 已经覆盖它，重复实现只会漂移。

