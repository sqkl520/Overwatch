name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 硬门：结构 + 语法 + 每个导出函数能否被调用 + 文档一致性
      # （测试数对账 / 文档引用的路径与命令 / 文档常量 / 研究索引 / 能力清单）
      - name: Structure gate
        run: node scripts/check-structure.mjs

      # `.claude/` 同时是项目布局和 plugin 根（里面有一个 .claude-plugin/plugin.json）。
      # 这一步守住「有人把 agents/ 挪走 / 把 skill 平铺 / 往载荷里塞 hooks」这类改动——
      # 它们不会让别的测试红，但会让宿主**静默加载不到**载荷。
      # 不 spawn 宿主（那要 4 秒且要登录态），只静态核对布局。
      - name: Payload layout
        run: node scripts/build-payload.mjs --verify-self

      # 硬门：全部回归测试（1860 条，含状态判定、TUI 视觉、键位路由）。
      # 数字由 check-structure.mjs 对账，与 README / CLAUDE / GUIDE 同源。
      #
      # `scripts/` 目录形式而不是 `scripts/*.test.mjs`：Node 22 之前**不展开 glob**，
      # 在 cmd.exe / PowerShell 上通配符会原样传给 Node 并报「文件找不到」。
      # CI 的 runner 是 bash，但文档里的同一条命令也会被别人在 Windows 默认终端里敲。
      #
      # **分两段跑。** 两个文件里的用例本质是「起一个真进程看它怎么死」
      # （`launch.test.mjs` spawn 宿主 28 次、`build-payload.test.mjs` 起子进程），
      # 默认并发下和其余三十多个文件抢资源，实测从 20 秒涨到 116 秒并被判超时。
      # 分开跑：快的一段 58 秒、慢的两条各自 20/53 秒，总时长反而更短且稳定。
      # 两段合起来仍是全量，一条不跳。
      - name: Tests (fast)
        run: |
          node --test $(ls scripts/*.test.mjs | grep -vE 'launch\.test\.mjs|build-payload\.test\.mjs')

      - name: Tests (spawn-heavy, serial)
        run: |
          node --test scripts/build-payload.test.mjs
          node --test scripts/launch.test.mjs

      # 死链检查不再单独实现：`check-structure.mjs` 的 `checkLinks()` 已经按
      # **文件所在目录**解析相对链接（早先这里用仓库根当基准，对 `docs/*.md`
      # 误报 9 条）。上面那道 Structure gate 已经覆盖它，重复实现只会漂移。

